# TerraTwin API behind the Vercel rewrite proxy: the browser calls /api/* and /v1/* on the Vercel domain
# (same origin), and Vercel forwards them here (apps/web/vercel.json). Only requests addressed to this
# box's IP match this server block, so the other sites on the host are unaffected.
# Install: sudo install -m 0644 deploy/nginx/terratwin-api.conf /etc/nginx/sites-available/terratwin-api
#          sudo ln -s /etc/nginx/sites-available/terratwin-api /etc/nginx/sites-enabled/terratwin-api
#          sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name 100.27.159.94;

    client_max_body_size 1m;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    gzip_proxied any;

    location /api/ {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
