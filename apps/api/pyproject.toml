[project]
name = "terratwin-api"
version = "0.1.0"
description = "TerraTwin scientific API: Mars-Earth analog discovery (MOSAIC tier-1 screen + G-series OOM research records)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyproj>=3.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
